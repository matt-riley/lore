name: Daemon artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]

    defaults:
      run:
        working-directory: daemon

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: cargo build --release

      - name: Package with checksums, manifest and SBOM
        run: node scripts/package.mjs --skip-build --dist dist

      - name: Verify the archive
        run: |
          for archive in dist/*.tar.gz; do
            node scripts/package.mjs --verify "$archive"
          done

      - name: Attach artifacts to the release
        if: github.event_name == 'release'
        working-directory: .
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            daemon/dist/*.tar.gz daemon/dist/*.sha256 daemon/dist/checksums.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
