name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@b65e4f9b6883ebb8735e5f5e61f46d226024b76d # v4
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      # Let a merged release finish before processing the next push.
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
