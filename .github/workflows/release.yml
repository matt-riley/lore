name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@9461001818caa7d1925854445cf053d0a0aac316 # v2
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      cancel-in-progress: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
